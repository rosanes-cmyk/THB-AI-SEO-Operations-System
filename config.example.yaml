# THB AI SEO Operations System — site and monitoring configuration.
#
#   cp config.example.yaml config.yaml
#
# Everything here is non-secret. Secrets live in .env.
#
# Verified against the live site on 2026-08-13:
#   canonical host   www.twinhomebuyer.com (non-www 301s to www)
#   platform         WordPress + Elementor 3.32.0
#   lead forms       Contact Form 7 (wpcf7-f30)
#   analytics        Google Site Kit 1.175.0 — so Search Console and GA4 are
#                    already wired to the site, which is what Stages 4 and 5 need
#   phone CTA        +1 (415) 415-8946
#   sitemap          669 pages, mostly programmatic city pages. NOTE: the
#                    sitemap lists URLs that 301 — /contact/ redirects to
#                    /contact-us/, and /we-buy-houses-in-oakland-ca-for-cash/
#                    to /we-buy-houses-oakland/. Config below uses the
#                    canonical destinations.
#
# `revenue_weight` (0-100) is the most important field in this file. It is what
# makes the system prioritize by BUSINESS impact rather than textbook SEO
# severity. The weights below are a starting proposal based on funnel position
# and page intent — they are NOT measured. Correct them once GA4 lead data is
# connected and you can see which pages actually produce contracts.

site:
  name: "Twin Home Buyer"
  base_url: "https://www.twinhomebuyer.com"
  timezone: "America/Los_Angeles"

# Scheduling cadences. Seconds.
schedule:
  heartbeat_interval_seconds: 300        # every 5 minutes  — revenue-page heartbeat
  vision_interval_seconds: 3600          # every 60 minutes — AI visual inspection
  crawl_interval_seconds: 21600          # every 6 hours    — technical crawl
  pagespeed_interval_seconds: 21600      # every 6 hours    — PageSpeed
  retention_interval_seconds: 86400      # daily            — disk cleanup
  digest_at: "07:00"                     # daily digest, in site.timezone

# Incident behavior (Rule 9 — no alert spam).
incidents:
  escalation_after_seconds: 3600
  min_persistence_to_alert: 2
  min_confidence_to_alert: 0.75

# Resource protection.
retention:
  screenshots_max_files: 400
  screenshots_max_age_days: 14
  reports_max_files: 180
  reports_max_age_days: 180
  logs_max_age_days: 30
  max_data_dir_mb: 2048

# Collector limits and timeouts.
limits:
  http_timeout_seconds: 20
  # The sitemap lists 669 pages. A full crawl at 1 req/sec is ~11 minutes, which
  # is fine every 6 hours and stays polite. Raise only if the site grows.
  crawl_max_pages: 700
  crawl_delay_seconds: 1.0
  pagespeed_max_urls: 8
  pagespeed_timeout_seconds: 90
  vision_max_pages: 8
  claude_max_calls_per_hour: 60

# ---------------------------------------------------------------------------
# Revenue attribution (Stage 6).
#
# Data comes from CSV exports dropped in data/revenue/input/:
#
#   deals.csv  deal_id, channel, attribution, stage, created_on,
#              closed_on, gross_profit, landing_page
#   spend.csv  channel, period_start, period_end, amount
#
# Column names are matched loosely, so a raw CRM export usually works as-is.
# `stage` must be one of: lead, qualified_lead, appointment, offer, contract,
# closing (common CRM wordings like "Closed Won" and "Under Contract" are
# recognized). `attribution` must be one of: manually_verified,
# source_reported, last_touch, first_touch, unknown — anything else is read as
# unknown rather than guessed at.
#
# Those CSVs contain seller records. data/ is gitignored; keep it that way.
# ---------------------------------------------------------------------------
revenue:
  # The return the business is actually managing to. Every channel verdict is
  # measured against this number, not an invented industry benchmark.
  target_roas: 3.0
  window_days: 90
  # Below this many deals, one closing either way swings the ratio, so the
  # channel is reported without a verdict.
  min_deals_for_roas: 5
  # Above this share of deals with no recorded source, the report says the
  # numbers are unreliable before it reports them.
  max_unknown_share: 0.30
  # Channels where zero recorded spend is expected rather than missing.
  organic_channels: ["seo", "organic", "direct", "referral"]
  currency: "USD"

# Viewports used by the vision collector.
viewports:
  - name: mobile
    width: 390
    height: 844
    is_mobile: true
  - name: desktop
    width: 1440
    height: 900
    is_mobile: false

# ---------------------------------------------------------------------------
# Pages.
#
# Every money page below was verified live: it returns 200, renders at least
# one Contact Form 7 form, carries a tel: CTA, and has exactly one H1.
#
# `min_visible_buttons: 1` is deliberately conservative. Vision counts visible
# CTA elements, and these Elementor templates render several; requiring only one
# means the check fires when the CTA block genuinely fails, not when a layout
# variant renders a different number of buttons.
# ---------------------------------------------------------------------------
pages:
  # --- Primary conversion paths -------------------------------------------
  - url: "https://www.twinhomebuyer.com/"
    name: "Homepage"
    money_page: true
    revenue_weight: 95
    expect:
      status: 200
      form: true
      phone_cta: true
      text_contains:
        - "cash"
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/contact-us/"
    name: "Contact"
    money_page: true
    revenue_weight: 92
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/sell-my-house-for-cash/"
    name: "Sell My House For Cash"
    money_page: true
    revenue_weight: 88
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/we-buy-houses-bay-area/"
    name: "We Buy Houses — Bay Area"
    money_page: true
    revenue_weight: 86
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/sell-your-house-fast-in-bay-area/"
    name: "Sell Your House Fast — Bay Area"
    money_page: true
    revenue_weight: 85
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/cash-offer-for-home/"
    name: "Cash Offer For Home"
    money_page: true
    revenue_weight: 82
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  - url: "https://www.twinhomebuyer.com/cash-home-buyers-bay-area/"
    name: "Cash Home Buyers — Bay Area"
    money_page: true
    revenue_weight: 80
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  # --- Top city page. One representative of the programmatic cluster is on
  # --- the 5-minute heartbeat; the rest are covered by the 6-hour crawl.
  - url: "https://www.twinhomebuyer.com/we-buy-houses-oakland/"
    name: "Oakland — We Buy Houses"
    money_page: true
    revenue_weight: 74
    expect:
      status: 200
      form: true
      phone_cta: true
      min_visible_buttons: 1

  # --- Monitored, but not a money page. Present so the crawler has a
  # --- low-weight comparison and defects here do not page anyone.
  - url: "https://www.twinhomebuyer.com/blog/"
    name: "Blog Index"
    money_page: false
    revenue_weight: 8
    expect:
      status: 200
